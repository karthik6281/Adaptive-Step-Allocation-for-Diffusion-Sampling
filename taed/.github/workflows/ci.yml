name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TAED_COMPVIS_ROOT: ${{ github.workspace }}/external/latent-diffusion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check out the pinned CompVis source
        run: |
          git init external/latent-diffusion
          git -C external/latent-diffusion remote add origin https://github.com/CompVis/latent-diffusion.git
          git -C external/latent-diffusion fetch --depth 1 origin a506df5756472e2ebaf9078affdde2c4f1502cd4
          git -C external/latent-diffusion checkout --detach FETCH_HEAD
      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          python -m pytest tests
      - name: Build a wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
