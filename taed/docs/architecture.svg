<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" style="display:block; max-width:100%; height:auto" role="img" aria-labelledby="title description">
  <title id="title">TAED: policy-controlled denoising</title>
  <desc id="description">One sampling decision. An observation encoder and policy propose an action. Constraints select a feasible denoise or skip. Denoising calls the frozen noise predictor and applies a DDIM jump; skipping bypasses both and holds the sample and source time. The next state is used for the following decision, or decoded at termination. Per-step rewards update only the policy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#586977"/>
    </marker>
    <marker id="training-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#487596"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #283943; }
      .heading { font-size: 22px; font-weight: 600; }
      .label { font-size: 16px; fill: #526572; }
      .sub { font-size: 14px; baseline-shift: sub; }
      .box { fill: #ffffff; stroke: #738896; stroke-width: 1.4; }
      .learned { fill: #edf4f8; stroke: #5b819a; stroke-width: 1.4; }
      .wire { fill: none; stroke: #586977; stroke-width: 1.6; stroke-linejoin: round; }
      .flow { fill: none; stroke: #586977; stroke-width: 1.6; stroke-linejoin: round; marker-end: url(#arrow); }
      .training { fill: none; stroke: #487596; stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 5 4; marker-end: url(#training-arrow); }
    </style>
  </defs>
  <rect width="1100" height="540" fill="#ffffff"/>

  <path class="training" d="M 450 477 H 20 V 100 H 80"/>
  <path class="flow" d="M 115 210 V 170 H 195 V 140"/>
  <text class="label" x="180" y="159" text-anchor="end">observation</text>
  <g id="policy">
    <rect class="learned" x="80" y="60" width="230" height="80" rx="5"/>
    <text class="heading" x="195" y="93" text-anchor="middle">Policy π<tspan class="sub">ϕ</tspan></text>
    <text x="195" y="121" text-anchor="middle">observation encoder</text>
  </g>
  <path class="flow" d="M 310 100 H 450"/>
  <text class="label" x="380" y="87" text-anchor="middle">proposed action</text>
  <g id="constraints">
    <rect class="box" x="450" y="60" width="250" height="80" rx="5"/>
    <text class="heading" x="575" y="93" text-anchor="middle">Action constraints</text>
    <text x="575" y="121" text-anchor="middle">NFE budget / skip limit</text>
  </g>
  <path class="flow" d="M 575 140 V 180 H 250 V 255"/>
  <text class="label" x="405" y="169" text-anchor="middle">executed action</text>

  <g id="state">
    <rect class="box" x="40" y="210" width="150" height="90" rx="5"/>
    <text x="115" y="244" text-anchor="middle" font-weight="600">Sampler state</text>
    <text x="115" y="275" text-anchor="middle">s<tspan class="sub">k</tspan></text>
  </g>
  <path class="wire" d="M 190 255 H 250"/>
  <circle cx="250" cy="255" r="3.5" fill="#586977"/>
  <path class="flow" d="M 250 255 H 320"/>
  <text class="label" x="285" y="241" text-anchor="middle">denoise</text>

  <g id="denoiser">
    <rect x="320" y="210" width="185" height="90" rx="5" fill="#f5f7f9" stroke="#738896" stroke-width="1.4"/>
    <text x="412.5" y="244" text-anchor="middle" font-weight="600">Frozen denoiser</text>
    <text x="412.5" y="275" text-anchor="middle">ε<tspan class="sub">θ</tspan>(x<tspan class="sub">τ</tspan>, τ)</text>
  </g>
  <path class="flow" d="M 505 255 H 555"/>
  <g id="ddim">
    <rect x="555" y="210" width="155" height="90" rx="5" fill="#f5f7f9" stroke="#738896" stroke-width="1.4"/>
    <text x="632.5" y="244" text-anchor="middle" font-weight="600">DDIM update</text>
    <text x="632.5" y="275" text-anchor="middle">τ → d<tspan class="sub">k</tspan></text>
  </g>
  <path class="flow" d="M 710 255 H 760"/>
  <g id="next-state">
    <rect class="box" x="760" y="210" width="125" height="90" rx="5"/>
    <text x="822.5" y="244" text-anchor="middle" font-weight="600">Next state</text>
    <text x="822.5" y="275" text-anchor="middle">s<tspan class="sub">k+1</tspan></text>
  </g>
  <path class="flow" d="M 885 255 H 950"/>
  <text class="label" x="917.5" y="241" text-anchor="middle">terminal</text>
  <g id="decoder">
    <rect class="box" x="950" y="210" width="125" height="90" rx="5"/>
    <text x="1012.5" y="244" text-anchor="middle" font-weight="600">Decoder</text>
    <text x="1012.5" y="275" text-anchor="middle">final image</text>
  </g>

  <path class="flow" d="M 250 255 V 365 H 822.5 V 300"/>
  <text x="536" y="351" text-anchor="middle">skip: x′ = x<tspan class="sub">τ</tspan>, τ′ = τ</text>
  <text class="label" x="536" y="389" text-anchor="middle">ΔNFE = 0</text>

  <path class="flow" d="M 855 300 V 415 H 610 V 438"/>
  <g id="learning">
    <rect class="learned" x="450" y="438" width="320" height="78" rx="5"/>
    <text class="heading" x="610" y="470" text-anchor="middle">Policy update</text>
    <text x="610" y="498" text-anchor="middle">r<tspan class="sub">k</tspan> = R − w<tspan class="sub">cost</tspan> · ΔNFE</text>
  </g>
  <text class="label" x="225" y="465" text-anchor="middle">training</text>
  <path class="flow" d="M 880 477 H 770" stroke-dasharray="5 4"/>
  <text class="label" x="895" y="466">paired reference</text>
  <text class="label" x="895" y="490">(optional)</text>
</svg>
