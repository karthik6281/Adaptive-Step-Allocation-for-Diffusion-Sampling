[build-system]
requires = ["setuptools==75.3.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "taed"
version = "0.1.0"
description = "Temporal-adaptive diffusion policies, rewards, training, and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "setuptools==75.3.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "matplotlib==3.10.1",
    "diffusers==0.27.2",
    "huggingface-hub==0.25.2",
    "transformers==4.44.2",
    "einops==0.8.0",
    "omegaconf==2.3.0",
    "PyYAML==6.0.2",
    "lpips==0.1.4",
    "timm==1.0.11",
]

[project.optional-dependencies]
compvis = [
    "pytorch-lightning==1.9.5",
    "torchmetrics==0.11.4",
    "taming-transformers-rom1504==0.0.6",
    "kornia==0.6.12",
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
]
dev = ["pytest==8.3.5", "ruff==0.15.11"]

[tool.setuptools]
py-modules = ["adapter_compvis", "run_rl", "run_eval"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "dasp*", "models*", "training*", "utils*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["compvis: integration tests requiring the pinned upstream CompVis checkout"]

[tool.ruff]
target-version = "py310"
line-length = 100
respect-gitignore = false
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
