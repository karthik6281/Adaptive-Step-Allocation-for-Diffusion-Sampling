[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steps"
version = "1.0"
description = "Fixed-budget per-sample step placement in diffusion samplers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
generate = ["torch>=1.12", "lpips>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
